<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple Hello World webpage." />
  <title>Hello World</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f8fafc; background: #0b1020; overflow: hidden; }
    .orb { position: fixed; width: 32rem; height: 32rem; border-radius: 50%; filter: blur(80px); opacity: .28; pointer-events: none; }
    .orb.one { background: #7c3aed; top: -12rem; left: -8rem; }
    .orb.two { background: #06b6d4; right: -10rem; bottom: -14rem; }
    main { position: relative; display: grid; place-items: center; min-height: 100vh; padding: 2rem; }
    .card { width: min(100%, 720px); padding: clamp(2rem, 7vw, 5rem); text-align: center; border: 1px solid rgba(255,255,255,.14); border-radius: 32px; background: rgba(15, 23, 42, .68); box-shadow: 0 30px 100px rgba(0,0,0,.32); backdrop-filter: blur(18px); }
    .eyebrow { margin: 0 0 1.25rem; color: #67e8f9; font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.2rem, 11vw, 7.5rem); line-height: .95; letter-spacing: -.07em; background: linear-gradient(110deg, #fff 20%, #a5f3fc 55%, #c4b5fd 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { max-width: 34rem; margin: 1.75rem auto 0; color: #cbd5e1; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.7; }
    .button { display: inline-flex; align-items: center; gap: .6rem; margin-top: 2.25rem; padding: .9rem 1.2rem; border: 0; border-radius: 999px; color: #082f49; background: #a5f3fc; font-weight: 800; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
    .button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(103,232,249,.25); }
    .note { min-height: 1.5em; margin-top: 1rem; color: #67e8f9; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="orb one"></div><div class="orb two"></div>
  <main>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">A tiny beginning</p>
      <h1 id="title">Hello world.</h1>
      <p>Sometimes the simplest page is the perfect place to start. Welcome to the web.</p>
      <button class="button" id="helloButton" type="button">Say hello <span aria-hidden="true">→</span></button>
      <div class="note" id="note" aria-live="polite"></div>
    </section>
  </main>
  <script>
    document.getElementById('helloButton').addEventListener('click', () => {
      document.getElementById('note').textContent = 'Hello right back 👋';
    });
  </script>
</body>
</html>
